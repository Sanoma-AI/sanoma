packages:
  - packages/*
  - packages/bridge-bin/*
  - packages/postgres-bin/*
  - connectors/*
allowBuilds:
  # The desktop shell's Electron binary (~100 MB): `pnpm --filter @sanoma-ai/desktop start` downloads it when missing.
  electron: false
  # electron-builder's Windows installer, unused: the shell builds for macOS.
  electron-winstaller: false
  lefthook: false
