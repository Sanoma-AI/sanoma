packages:
  - packages/*
  - packages/bridge-bin/*
  - packages/postgres-bin/*
  - connectors/*
allowBuilds:
  # The desktop shell's Electron binary (~100 MB): `pnpm --filter @sanoma-ai/desktop start` downloads it when missing.
  electron: false
  # The desktop makers (packages/desktop/forge.config.mts): the dmg's Finder metadata, and the
  # Windows installer's 7-Zip for this architecture.
  electron-winstaller: true
  fs-xattr: true
  macos-alias: true
  lefthook: false
  # Pi's model providers (through connector-pi's @ai-sdk/harness-pi): their install scripts are not needed.
  "@google/genai": false
  protobufjs: false
  # The app's Worker build for the Cloudflare host (@cloudflare/vite-plugin, wrangler): their
  # binaries come as platform packages, so the checks their scripts make are not needed.
  esbuild: false
  workerd: false
overrides:
  # One AI SDK: @ai-sdk/harness 1.0.158 pins ai 7.0.147, and with it its own
  # @ai-sdk/provider-utils (5.0.64), whose `Tool` type is then not the app's: the chat's catalog
  # tools are made by the app's `ai` and given to HarnessAgent. Its later releases' Claude Code and
  # Codex adapters ship without their bridges' lockfiles (vercel/ai#23829); drop both once one does.
  ai: 7.0.153
  "@ai-sdk/provider-utils": 5.0.68
# pnpm's default, stated: Electron Forge's system check (packages/desktop) asks for a hoist pattern
# or the hoisted linker. The shell's build is bundled by Vite and packs no node_modules.
hoistPattern:
  - "*"
