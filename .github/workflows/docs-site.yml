# The docs site (docs-site, docs.sanoma.work): built on pull requests that change it, so a broken link
# or a connector the reference cannot read fails there, and deployed to Cloudflare Pages when a
# release/<version> branch is pushed (README "Release") or when run by hand, so the site describes the
# release people have installed. See docs-site/README.md.
name: Docs site
on:
  pull_request:
    paths:
      - docs-site/**
      - packages/sanoma/workflows/src/**
      - packages/sanoma/docs/**
      - packages/sanoma/package.json
      - connectors/*/src/**
      - connectors/*/package.json
      - docs-site/pnpm-lock.yaml
      - .github/workflows/docs-site.yml
  push:
    branches:
      - release/*
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, never cancelled half way; a pull request's newer push replaces its build.
concurrency:
  group: docs-site-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    # Actions pinned to commits: on a release branch this job holds the Cloudflare token.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Node and pnpm from .mise.toml, the one pin; pnpm then switches to `packageManager`.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: ${{ github.event_name == 'pull_request' }}
      # The root's packages for the connectors the reference reads, then the site's own (its own lockfile).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir docs-site install --frozen-lockfile
      # Writes the connector reference, builds the pages and the search index, and fails on a link
      # to a page or heading that is not there.
      - run: pnpm --dir docs-site build
      # Wrangler is the docs app's own, from the lockfile. Without the secrets (a fork, or before
      # the Pages project exists) nothing is deployed, and the run says so.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set: built, not deployed (docs-site/README.md)"
            exit 0
          fi
          pnpm --dir docs-site exec wrangler pages deploy dist --project-name sanoma-docs --branch main --commit-dirty=true
          echo "Deployed \`$GITHUB_SHA\` (\`$GITHUB_REF_NAME\`) to https://docs.sanoma.work." >> "$GITHUB_STEP_SUMMARY"
