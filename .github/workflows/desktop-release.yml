name: Desktop release
# Run by hand on main: uploads the unsigned macOS app to a DRAFT GitHub Release `desktop-v<version>`
# (README "Desktop (preview)").
on:
  workflow_dispatch:

permissions:
  actions: read # to see the commit's CI run
  contents: write # to create the draft release

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    # Actions pinned to commits, as in release.yml: this job writes releases.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
      - name: The version is not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/desktop/package.json)
          tag="desktop-v$version"
          # A draft has no tag yet, so the releases (drafts included) are checked as well as the tags.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q '.[].tag_name')
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || grep -qxF "$tag" <<<"$releases"; then
            echo "::error::$tag exists: bump version in packages/desktop/package.json, or delete the draft"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache: a release never restores another run's cache.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Builds the shell, stages Node for arm64 and x64 and pnpm, and packs both architectures
      # (electron-builder.yml), signed ad hoc: no keychain identity is looked for.
      - run: pnpm --filter @sanoma-ai/desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Each app verifies and carries its own architecture's Node
        working-directory: packages/desktop/release
        run: |
          for pair in mac-arm64:arm64 mac:x86_64; do
            app="${pair%%:*}/Sanoma.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            node_arch=$(lipo -archs "$app/Contents/Resources/node/node")
            [ "$node_arch" = "${pair##*:}" ] || { echo "::error::$app carries a $node_arch Node"; exit 1; }
          done
          ls -l ./*.dmg ./*.zip
      - name: Draft release
        working-directory: packages/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Sanoma desktop $VERSION (unsigned preview)" --notes-file ../RELEASE_NOTES.md \
            "Sanoma-$VERSION"-*.dmg "Sanoma-$VERSION"-*.zip
          echo "Draft release desktop-v$VERSION from $GITHUB_SHA: publish it on GitHub after trying the download." >> "$GITHUB_STEP_SUMMARY"
