name: Desktop release
# Run by hand on main: uploads the macOS app, signed with the Developer ID and notarized, to a DRAFT
# GitHub Release `v<version>` (README "Desktop (preview)"). Once published, it is the update
# update.electronjs.org offers the installed apps (packages/desktop/src/self-update.ts).
on:
  workflow_dispatch:

permissions:
  actions: read # to see the commit's CI run
  contents: write # to create the draft release

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # The certificate in MAC_CERT_P12 (another team's asks installed apps for Keychain access once:
      # packages/desktop/README.md, "Signing and notarization").
      APPLE_SIGNING_IDENTITY: "Developer ID Application: LEON KWAN (6NP563U4MV)"
    # Actions pinned to commits, as in release.yml: this job writes releases.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
      - name: The version is not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version packages/desktop/package.json)
          # update.electronjs.org reads only releases whose tag is a semver version. `v0.2.0` to
          # `v0.4.2` are the npm packages' old tags (README "Desktop (preview)"), so 0.5.0 comes next.
          tag="v$version"
          # A draft has no tag yet, so the releases (drafts included) are checked as well as the tags.
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" -q '.[].tag_name')
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || grep -qxF "$tag" <<<"$releases"; then
            echo "::error::$tag exists: bump version in packages/desktop/package.json, or delete the draft"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node and pnpm from .mise.toml. No cache: a release never restores another run's cache.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # The Developer ID certificate goes into a keychain of this run's own, with Apple's intermediate
      # (pinned) in case the .p12 lacks it, and the App Store Connect API key into a file; the last
      # step deletes both.
      - name: Signing keychain and notarization key
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          base64 --decode <<<"$MAC_CERT_P12" > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          g2=f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
          if ! security find-certificate -a -Z "$keychain" | grep -qix "SHA-256 hash: $g2"; then
            curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            shasum -a 256 -c <<<"$g2  $RUNNER_TEMP/DeveloperIDG2CA.cer"
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$APPLE_SIGNING_IDENTITY\"" ||
            { echo "::error::MAC_CERT_P12 holds no valid $APPLE_SIGNING_IDENTITY"; exit 1; }
          grep -q "BEGIN PRIVATE KEY" <<<"$APPLE_API_KEY" || { echo "::error::APPLE_API_KEY is not a .p8 key"; exit 1; }
          printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/apple-api-key.p8"
      # Stages Node for arm64 and x64 and pnpm, then Forge builds and packs both architectures,
      # signed with the Developer ID and notarized, the apps and the dmgs (forge.config.mts).
      - run: pnpm --filter @sanoma-ai/desktop run make
        env:
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Each app and dmg is signed and notarized, and each app carries its own architecture's Node
        working-directory: packages/desktop/out
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Gatekeeper's verdict on $1 (spctl's options after it): accepted as notarized.
          notarized() {
            assessment=$(spctl --assess -vv "${@:2}" "$1" 2>&1) || true
            echo "$assessment"
            grep -qxF "source=Notarized Developer ID" <<<"$assessment" || { echo "::error::$1 is not notarized"; exit 1; }
          }
          for pair in arm64:arm64 x64:x86_64; do
            arch=${pair%%:*}
            app="Sanoma-darwin-$arch/Sanoma.app"
            dmg="make/dmg/$arch/Sanoma-$VERSION-$arch.dmg"
            codesign --verify --deep --strict --verbose=2 "$app"
            notarized "$app" --type execute
            xcrun stapler validate "$app"
            codesign --verify --verbose=2 "$dmg"
            notarized "$dmg" --type open --context context:primary-signature
            xcrun stapler validate "$dmg"
            node="$app/Contents/Resources/node/node"
            node_arch=$(lipo -archs "$node")
            [ "$node_arch" = "${pair##*:}" ] || { echo "::error::$app carries a $node_arch Node"; exit 1; }
            # node.entitlements.plist reached it (optionsForFile matches the Node by its path).
            codesign -d --entitlements - "$node" 2>/dev/null | grep -q disable-library-validation ||
              { echo "::error::$node lacks node.entitlements.plist"; exit 1; }
          done
          # The runner is Apple silicon: under the hardened runtime, its Node starts, JIT and all, and
          # so does the app, still running 15 seconds on.
          Sanoma-darwin-arm64/Sanoma.app/Contents/Resources/node/node -e 'console.log("node", process.version, "starts")'
          Sanoma-darwin-arm64/Sanoma.app/Contents/MacOS/Sanoma --user-data-dir="$RUNNER_TEMP/user-data" &
          sleep 15
          kill -0 $! || { echo "::error::the signed app exits at start"; exit 1; }
          kill $!
      # Forge names the dmg Sanoma-<version>-<arch>.dmg and the zip Sanoma-darwin-<arch>-<version>.zip,
      # the name update.electronjs.org needs: a Mac zip's has `-darwin`, and `-arm64` for that build.
      - name: Draft release
        working-directory: packages/desktop/out/make
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Each dmg also under a name without the version, which the website's download buttons
          # name: releases/latest/download/Sanoma-mac-<arch>.dmg is the newest published release's.
          mkdir latest
          assets=()
          for arch in arm64 x64; do
            cp "dmg/$arch/Sanoma-$VERSION-$arch.dmg" "latest/Sanoma-mac-$arch.dmg"
            assets+=("dmg/$arch/Sanoma-$VERSION-$arch.dmg" "zip/darwin/$arch/Sanoma-darwin-$arch-$VERSION.zip" "latest/Sanoma-mac-$arch.dmg")
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Sanoma desktop $VERSION (preview)" --notes-file ../../RELEASE_NOTES.md "${assets[@]}"
          echo "Draft release v$VERSION from $GITHUB_SHA: publish it on GitHub, as the latest release, after trying the download." >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the signing keychain and the notarization key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/user-data"
