name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: dbos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      # Node and pnpm from .mise.toml, the one pin; pnpm then switches to `packageManager`.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: true
      - id: pnpm
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Each @sanoma-ai/postgres-<platform> payload, made by its prepack as release.yml makes it; this runner's is checked.
      - uses: actions/cache@v4
        id: postgres
        with:
          path: |
            packages/postgres-bin/*/postgres.tar.gz
            packages/postgres-bin/*/postgres.json
          key: postgres-${{ hashFiles('packages/sanoma/scripts/download-postgres.ts', 'packages/postgres-bin/*/package.json') }}
      - if: steps.postgres.outputs.cache-hit != 'true'
        run: pnpm --filter "./packages/postgres-bin/*" run prepack
      - run: pnpm postgres:download --check
      - run: pnpm test
      - name: Generated bridge client is up to date
        run: pnpm --filter @sanoma-ai/bridge run generate && git diff --exit-code packages/bridge/src/gen && test -z "$(git status --porcelain packages/bridge/src/gen)"

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image (not pushed)
        run: docker build -t sanoma-runtime packages/sanoma/runtime
