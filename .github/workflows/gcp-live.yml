name: GCP live verification
on:
  workflow_dispatch:
    inputs:
      project:
        description: Disposable GCP project ID
        required: true
        type: string
      project_number:
        description: Numeric project ID
        required: true
        type: string
      provisioner:
        description: Federated provisioning service-account email
        required: true
        type: string
      denied_account:
        description: Existing service account this federation must not impersonate
        required: true
        type: string
      key_ring:
        description: Existing disposable CryptoKeyRing resource name
        required: true
        type: string
      audience:
        description: Full workload identity provider audience
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-live-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANOMA_GCP_PROVISION_LIVE: "1"
      SANOMA_GCP_LIVE_PROJECT: ${{ inputs.project }}
      SANOMA_GCP_LIVE_PROJECT_NUMBER: ${{ inputs.project_number }}
      SANOMA_GCP_LIVE_PROVISIONER: ${{ inputs.provisioner }}
      SANOMA_GCP_LIVE_OTHER_ACCOUNT: ${{ inputs.denied_account }}
      SANOMA_GCP_LIVE_RING: ${{ inputs.key_ring }}
      SANOMA_GCP_LIVE_AUDIENCE: ${{ inputs.audience }}
      SANOMA_BRIDGE_BIN: /tmp/sanoma-455-provider-bridge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm bridge:download --out "$SANOMA_BRIDGE_BIN"
      - run: pnpm vitest run connectors/gcp/test/live.test.ts
