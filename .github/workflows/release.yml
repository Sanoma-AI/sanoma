name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No cache: a release never restores another run's cache. pnpm 11 does the npm OIDC exchange itself.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the shared version of the public packages
        run: |
          versions=$(pnpm -r ls --depth -1 --json | jq -r '[.[] | select(.private | not) | .version] | unique | join(" ")')
          if [ "$versions" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the public packages' version: $versions"
            exit 1
          fi
      # Packages already on npm are skipped without running prepack, so their dependents need this
      # build; the packages that do publish rebuild in their prepack, which keeps the hand path safe.
      - run: pnpm build
      # --no-git-checks: a tag checkout is a detached HEAD, not the publish branch.
      - run: pnpm -r publish --no-git-checks
