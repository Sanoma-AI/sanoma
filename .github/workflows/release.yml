name: Release
# Run by hand on main (README "Release"): it publishes every public package whose version is not yet on npm.
on:
  workflow_dispatch:

permissions:
  actions: read # to see the commit's CI run
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Actions pinned to commits: this job can publish every package.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
      # Node and pnpm from .mise.toml. No cache: a release never restores another run's cache.
      # pnpm 11 does the npm OIDC exchange itself.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # Each package left at its public version takes the new versions it depends on.
      - run: node scripts/release-check.ts
      # Packages already public are skipped without running prepack, so their dependents need this
      # build; the packages being published rebuild in their prepack, which keeps the hand path safe.
      - run: pnpm build
      # --no-git-checks: the first step checks the commit instead. The prepack of each
      # @sanoma-ai/bridge-<platform> downloads the provider-bridge release RELEASE pins, and of each
      # @sanoma-ai/postgres-<platform> zonky's jar from Maven Central (unzip and xz on the runner).
      # --report-summary writes each published version to pnpm-publish-summary.json.
      - run: pnpm publish -r --no-git-checks --report-summary
      - name: Published versions
        run: |
          jq -r '.publishedPackages[] | "\(.name)@\(.version)"' pnpm-publish-summary.json > published.txt
          cat published.txt
          if [ ! -s published.txt ]; then
            echo "Nothing published: every version is already public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Published versions"
            echo
            echo "From $GITHUB_SHA:"
            echo
            echo '```'
            cat published.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
