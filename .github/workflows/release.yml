name: Release
on:
  push:
    tags: ["v*"]

permissions:
  actions: read # to see the tagged commit's CI run
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Actions pinned to commits: this job can publish every package.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      # No cache: a release never restores another run's cache. pnpm 11 does the npm OIDC exchange itself.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the shared version of the public packages
        run: |
          versions=$(pnpm -r ls --depth -1 --json | jq -r '[.[] | select(.private | not) | .version] | unique | join(" ")')
          if [ "$versions" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the public packages' version: $versions"
            exit 1
          fi
      # Packages already on npm are skipped without running prepack, so their dependents need this
      # build; the packages being staged rebuild in their prepack, which keeps the hand path safe.
      - run: pnpm build
      # Staged, not published: the trusted publishers allow `npm stage publish` only, and a
      # maintainer releases the staged versions with one `pnpm stage approve` (README "Release").
      # --no-git-checks: a tag checkout is a detached HEAD, not the publish branch. The prepack of
      # each @sanoma-ai/bridge-<platform> downloads the provider-bridge release RELEASE pins.
      # --report-summary writes each staged version, with its stage id, to pnpm-publish-summary.json.
      - run: pnpm stage publish -r --no-git-checks --report-summary
      - name: Staged versions
        run: |
          jq -r '.publishedPackages[] | "\(.name)@\(.version) \(.stageId // error("no stage id for \(.name)"))"' pnpm-publish-summary.json > staged.txt
          cat staged.txt
          if [ ! -s staged.txt ]; then
            echo "Nothing staged: every public version is already on npm." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Staged versions"
            echo
            echo '```'
            cat staged.txt
            echo '```'
            echo
            echo "Release them all with one 2FA code, with the repo's pnpm and logged in to npm:"
            echo
            echo '```sh'
            echo "pnpm stage approve $(jq -r '[.publishedPackages[].stageId] | join(" ")' pnpm-publish-summary.json)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
