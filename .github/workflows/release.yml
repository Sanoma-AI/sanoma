name: Release
# Run by hand on main (README "Release"): it publishes every public package whose version is not yet on npm,
# then pushes the runtime image for the sanoma version when Docker Hub does not have it yet.
on:
  workflow_dispatch:

permissions:
  actions: read # to see the commit's CI run
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Actions pinned to commits: this job can publish every package.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
      # Node and pnpm from .mise.toml. No cache: a release never restores another run's cache.
      # pnpm 11 does the npm OIDC exchange itself.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # Each package left at its public version takes the new versions it depends on.
      - run: node scripts/release-check.ts
      # Packages already public are skipped without running prepack, so their dependents need this
      # build; the packages being published rebuild in their prepack, which keeps the hand path safe.
      - run: pnpm build
      # --no-git-checks: the first step checks the commit instead. The prepack of each
      # @sanoma-ai/bridge-<platform> downloads the provider-bridge release RELEASE pins, and of each
      # @sanoma-ai/postgres-<platform> zonky's jar from Maven Central (unzip and xz on the runner).
      # --report-summary writes each published version to pnpm-publish-summary.json.
      - run: pnpm publish -r --no-git-checks --report-summary
      - name: Published versions
        run: |
          jq -r '.publishedPackages[] | "\(.name)@\(.version)"' pnpm-publish-summary.json > published.txt
          cat published.txt
          if [ ! -s published.txt ]; then
            echo "Nothing published: every version is already public." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Published versions"
            echo
            echo "From $GITHUB_SHA:"
            echo
            echo '```'
            cat published.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  runtime-image:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/sanomaai/runtime
    # Actions pinned to commits, as in the publish job: this job holds the Docker Hub token.
    steps:
      # Secrets cannot be read in `if:`, so this step reads them and says whether to go on.
      - name: Docker Hub secrets are set
        id: hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Runtime image skipped::The secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set."
            echo "Runtime image skipped: the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are not set." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.hub.outputs.set
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.hub.outputs.set
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.hub.outputs.set
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tagged with the sanoma version, never `latest`. A run that published only other packages
      # finds the tag there and pushes nothing, so a version's image is never replaced.
      - name: Tag not yet on Docker Hub
        id: image
        if: steps.hub.outputs.set
        run: |
          tag="$IMAGE:$(jq -r .version packages/sanoma/package.json)"
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$RUNNER_TEMP/inspect.err"; then
            echo "::notice title=Runtime image skipped::$tag is already on Docker Hub."
            echo "Runtime image skipped: \`$tag\` is already on Docker Hub." >> "$GITHUB_STEP_SUMMARY"
          # Only a missing tag (or, before the first push, a missing repository) is a push; any other
          # error stops here, as pushing then could replace a tag that is there.
          elif grep -qE ': not found|repository does not exist' "$RUNNER_TEMP/inspect.err"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
      # No layer cache, as in the publish job: a release never restores another run's cache.
      - if: steps.image.outputs.tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/sanoma/runtime
          platforms: linux/amd64
          # One image manifest, not an index with an attestation, for a host that pulls it by tag.
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.tag }}
      - if: steps.image.outputs.tag
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: echo "Pushed \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
