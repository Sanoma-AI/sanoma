name: Release
# Run by hand on release/<version>, a branch at the bump's merge commit, never on main (README "Release"):
# it publishes every public package whose version is not yet on npm, then pushes the runtime image for the
# sanoma version to GitHub's registry (ghcr.io/sanoma-ai/runtime) when it does not have it yet, and the
# company template (packages/sanoma/template) to Sanoma-AI/company-template's main.
on:
  workflow_dispatch:

permissions:
  actions: read # to see the commit's CI run
  contents: read
  id-token: write # npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Actions pinned to commits: this job can publish every package.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ref is a release branch, its commit on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/*) ;;
            *) echo "::error::Run on release/<version> pushed at the bump's merge commit, not $GITHUB_REF (README \"Release\")"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --branch main --json conclusion -q '.[0].conclusion')
          [ "$ci" = success ] || { echo "::error::CI on $GITHUB_SHA is '${ci:-not run}', not success"; exit 1; }
          echo "Publishing from \`$GITHUB_SHA\` on \`$GITHUB_REF_NAME\`." >> "$GITHUB_STEP_SUMMARY"
      # Node and pnpm from .mise.toml. No cache: a release never restores another run's cache.
      # pnpm 11 does the npm OIDC exchange itself.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      # What it refuses is in its header; a release branch moved after a partial run is among it, since a
      # version public from the first commit then shows source changed since. Prints the versions to publish.
      - name: Release check
        run: |
          node scripts/release-check.ts > "$RUNNER_TEMP/to-publish.txt"
          cat "$RUNNER_TEMP/to-publish.txt"
          {
            echo "## To publish"
            echo
            if [ -s "$RUNNER_TEMP/to-publish.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/to-publish.txt"
              echo '```'
            else
              echo "Nothing: every version is already public."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Each package published below builds in its prepack (sanoma first: the order is the dependencies').
      # One already public is skipped without it, and its dependents' prepack then lacks its dist/: after a
      # partial run, with sanoma public already, build it all here first. One build either way.
      - name: Build after a partial run
        run: grep -q '^sanoma@' "$RUNNER_TEMP/to-publish.txt" || pnpm build
      # --no-git-checks: the first step checks the commit instead. The prepack of each
      # @sanoma-ai/bridge-<platform> downloads the provider-bridge release RELEASE pins, and of each
      # @sanoma-ai/postgres-<platform> zonky's jar from Maven Central (unzip and xz on the runner).
      - run: pnpm publish -r --no-git-checks

  runtime-image:
    needs: publish
    runs-on: ubuntu-latest
    # The job's GITHUB_TOKEN pushes the package; no other secret. The package ghcr.io/sanoma-ai/runtime
    # was made public once by hand in GitHub (its package settings): Cloudflare pulls it anonymously.
    permissions:
      contents: read
      packages: write
    # Actions pinned to commits, as in the publish job: this job can push the runtime image.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Node and pnpm for scripts/runtime-packages.ts; no install. No cache, as in the publish job.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tagged with the sanoma version, never `latest`. A run that published only other packages
      # finds the tag there and pushes nothing, so a version's image is never replaced.
      - name: Tag not yet on ghcr.io
        id: image
        run: |
          tag="ghcr.io/sanoma-ai/runtime:$(jq -r .version packages/sanoma/package.json)"
          # The store's template: this commit's public packages, which the publish job just put on npm.
          echo "packages=$(node scripts/runtime-packages.ts)" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$tag" > /dev/null 2> "$RUNNER_TEMP/inspect.err"; then
            echo "::notice title=Runtime image skipped::$tag is already on ghcr.io."
          # Only a missing tag (or, before the first push, a missing package, which ghcr.io answers
          # as denied) is a push; any other error stops here, as pushing then could replace a tag
          # that is there. A token denied a package it cannot read cannot push to it either.
          elif grep -qiE ': not found|manifest unknown|name unknown|denied' "$RUNNER_TEMP/inspect.err"; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/inspect.err" >&2
            exit 1
          fi
      # The README's hand command, with the same flags. No layer cache, as in the publish job.
      - if: steps.image.outputs.tag
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/sanoma/runtime
          platforms: linux/amd64
          # One image manifest, not an index with an attestation: the copy into Cloudflare's registry takes one.
          provenance: false
          push: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: PACKAGES=${{ steps.image.outputs.packages }}

  company-template:
    needs: publish
    runs-on: ubuntu-latest
    # Sanoma Cloud's sign-up makes a company from Sanoma-AI/company-template, `sanoma init` from the template
    # this package ships: this job makes the first the second, at this release's versions, with a lockfile
    # (a host installs with --frozen-lockfile). COMPANY_TEMPLATE_TOKEN is a fine-grained token with contents
    # write on that repository alone; the repository keeps its own README.md, LICENSE, .github/ and .mise.toml.
    permissions:
      contents: read
    # Actions pinned to commits, as in the publish job: this job pushes to another repository's main.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Sanoma-AI/company-template
          ref: main
          token: ${{ secrets.COMPANY_TEMPLATE_TOKEN }}
          path: .company-template
      # Node and pnpm for the lockfile. No cache, as in the publish job.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
      - name: Mirror the template
        run: |
          version=$(jq -r .version packages/sanoma/package.json)
          pm=$(jq -r .packageManager package.json)
          cd .company-template
          if [ "$(jq -r '.dependencies.sanoma // empty' package.json 2>/dev/null)" = "$version" ]; then
            echo "::notice title=Company template unchanged::Sanoma-AI/company-template already has sanoma $version's template."
            exit 0
          fi
          git ls-files -z | { grep -zvE '^(README\.md|LICENSE|\.mise\.toml|\.github/.*)$' || true; } | xargs -0 -r git rm -q --
          cp -R ../packages/sanoma/template/. .
          # npm drops a package's .gitignore, so the template carries it as gitignore (as `sanoma init` renames it).
          mv gitignore .gitignore
          # As an installed launcher pins them (`pinDependencies`), with the pnpm this repository runs.
          jq --arg v "$version" --arg pm "$pm" '
            .dependencies |= with_entries(if .key == "sanoma" or (.key | startswith("@sanoma-ai/connector-")) then .value = $v else . end)
            | .packageManager = $pm' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          # The registry may take a minute to serve what the publish job just published.
          for wait in 0 30 60 120; do
            sleep "$wait"
            pnpm install --lockfile-only && break
          done
          [ -f pnpm-lock.yaml ] || { echo "::error::pnpm could not write the lockfile for sanoma $version"; exit 1; }
          git add -A
          if git diff --cached --quiet; then
            echo "::notice title=Company template unchanged::Sanoma-AI/company-template already has sanoma $version's template."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s --quiet -m "The template of sanoma $version"
          git push origin HEAD:main
          echo "Pushed sanoma $version's template to Sanoma-AI/company-template." >> "$GITHUB_STEP_SUMMARY"
