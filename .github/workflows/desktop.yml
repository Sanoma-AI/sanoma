name: Desktop
# The desktop shell's smoke test (packages/desktop/test/e2e): Electron, from the build, opens a
# fixture company whose launcher is a fake. Only for changes to the shell; ci.yml runs its unit tests.
on:
  push:
    branches: [main]
    paths: &paths
      - packages/desktop/**
      # Its `engines`, which the shipped Node must satisfy.
      - packages/sanoma/template/package.json
      - .github/workflows/desktop.yml
  pull_request:
    paths: *paths

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `allowBuilds` skips Electron's download in a plain install.
      - run: node packages/desktop/scripts/electron.ts
      - run: pnpm --filter @sanoma-ai/desktop run build
      # The pinned Node for linux-x64, which runs the fake launcher as it runs a company, and this pnpm.
      - run: pnpm --filter @sanoma-ai/desktop run stage:resources
      # Ubuntu's AppArmor refuses Chromium's sandbox the user namespaces it needs; the shell keeps its sandbox on.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm --filter @sanoma-ai/desktop run test:e2e
