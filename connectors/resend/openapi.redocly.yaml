# `pnpm run generate` bundles Resend's OpenAPI spec, pinned to a commit and cut to the
# operations the driver calls and the schemas they use, then generates src/resend-api.d.ts.
apis:
  resend:
    root: https://raw.githubusercontent.com/resend/resend-openapi/8916b099d7f52b8552a2e1ef38a7f16fcd17864c/resend.yaml
    decorators:
      filter-in:
        property: operationId
        value: [broadcasts/create, broadcasts/send]
      # Webhooks have no operationId, so filter-in keeps them.
      filter-out:
        property: tags
        value: [Webhook Events]
