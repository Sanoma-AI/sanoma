# pnpm holds back a release younger than its minimum age; a fresh Sanoma release is one.
minimumReleaseAgeExclude:
  - sanoma
  - "@sanoma-ai/*"
# pnpm 11 stops an install on a dependency's build script it was not told about: the first two come
# with the app's Pi agent (its model providers), the others with its Worker build for the Cloudflare
# host (their binaries come as platform packages), and none is needed.
allowBuilds:
  "@google/genai": false
  protobufjs: false
  esbuild: false
  workerd: false
