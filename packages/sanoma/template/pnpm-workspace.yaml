# pnpm holds back a release younger than its minimum age; a fresh Sanoma release is one.
minimumReleaseAgeExclude:
  - sanoma
  - "@sanoma-ai/*"
# pnpm 11 stops an install on a dependency's build script it was not told about: these two come
# with the app's Pi agent (its model providers) and are not needed.
allowBuilds:
  "@google/genai": false
  protobufjs: false
