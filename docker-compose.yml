# Postgres for DBOS, the workflow runtime. Local development only.
services:
  postgres:
    image: postgres:17
    # Each worktree's test gate peaks near 60 connections, and gates run side by side.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_PASSWORD: dbos
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
